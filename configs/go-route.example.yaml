listen: ":4000"

sink:
  type: log

# Uncomment the config below to use postgresql to store log
# sink:
#   type: postgres
#   dsn: ${DATABASE_URL}
#   buffer_size: 4096
#   batch_size: 100
#   flush_interval: 1s

providers:
  openai:
    type: oaicompat
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}


  broken:
    type: oaicompat
    base_url: http://127.0.0.1:1/v1
    api_key: unused

  badkey:
    type: oaicompat
    base_url: https://api.openai.com/v1
    api_key: sk-definitely-not-a-real-key

targets:
  openai/gpt-5-mini:
    provider: openai
    model: gpt-5-mini

  broken/dead:
    provider: broken
    model: does-not-matter

  badkey/gpt-5-mini:
    provider: badkey
    model: gpt-5-mini

models:
  direct:
    - openai/gpt-5-mini

  chat:
    - broken/dead
    - openai/gpt-5-mini

  auth-fail:
    - badkey/gpt-5-mini
    - openai/gpt-5-mini
