listen: ":4000"

sink:
  dsn: ${DATABASE_URL}

  # Every record is appended to a local spool before it goes to Postgres,
  # so a slow or down database delays records instead of losing them.
  # One directory per gateway process, on storage that survives a restart.
  spool_dir: data/spool
  segment_max_bytes: 67108864   # 64 MiB per segment file
  sync: interval                # or "always": fsync before Record returns
  sync_interval: 200ms          # worst-case loss window on power failure
  max_spool_bytes: 1073741824   # 1 GiB: log an alarm past this, never drop
  buffer_size: 4096             # records queued in memory for the file writer

  # The shipper: rows per transaction, and how often a partly filled
  # segment is sent anyway.
  batch_size: 100
  flush_interval: 1s

# Live quota counters. A quota is a spend cap, so enforcement also needs
# the pricing table below: without prices nothing can be costed and
# startup says so at error level. Leave redis out entirely and quotas are
# NOT enforced (startup logs a warning); the quota rows in Postgres are
# then ignored.
redis:
  addr: localhost:6379
  password: ""
  db: 0
  timeout: 100ms          # per call; an outage costs a request this long
  on_unavailable: open    # open: serve unenforced; closed: 503

quota:
  default_max_output_tokens: 4096  # sizes a request that sets no max_tokens
  limits_ttl: 10s                  # how long a changed cap takes to bite
  flush_interval: 1s               # counter deltas to Postgres
  flush_buffer: 8192               # deltas held before dropping
  resync_interval: 60s             # raise live counters back to Postgres

providers:
  broken:
    type: oaicompat
    base_url: http://127.0.0.1:1/v1
    api_key: unused

  openai:
    type: oaicompat
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  badkey:
    type: oaicompat
    base_url: https://api.openai.com/v1
    api_key: sk-definitely-not-a-real-key

# Target available for each provider
targets:
  broken/dead:
    provider: broken
    model: does-not-matter

  badkey/gpt-5-mini:
    provider: badkey
    model: gpt-5-mini

  openai/gpt-5-mini:
    provider: openai
    model: gpt-5-mini

  openai/gpt-5:
    provider: openai
    model: gpt-5

# Custom model name with ladder
models:
  chat:
    - broken/dead
    - openai/gpt-5-mini
  direct:
    - openai/gpt-5-mini
  auth-fail:
      - badkey/gpt-5-mini
      - openai/gpt-5-mini 

# Pricing table for each target
pricing:
  compare_against:
    - openai/gpt-5
  table:
    - effective_from: 2026-08-25
      rates:
        openai/gpt-5-mini:
          input_per_million: 0.25
          output_per_million: 2.00
          cache_read_per_million: 0.025
          cache_write_per_million: 0.3125

        openai/gpt-5:
          input_per_million: 1.25
          output_per_million: 10.00
          cache_read_per_million: 0.125

    - effective_from: 2026-09-01
      rates:
        openai/gpt-5-mini:
          input_per_million: 0.20
          output_per_million: 1.60
          cache_read_per_million: 0.020
        openai/gpt-5:
          input_per_million: 1.25
          output_per_million: 10.00
          cache_read_per_million: 0.125