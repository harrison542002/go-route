openapi: 3.0.3

info:
  title: go-route admin API
  version: 1.0.0
  description: |
    Tenants, their API keys and their quotas. This document is the contract: schemas/admin/gen is
    generated from it and every request under /admin/ is validated against it. See docs/admin-api.md.
tags:
  - name: auth
  - name: tenants
  - name: keys
  - name: quotas
  - name: observability
  - name: health

security:
  - adminToken: []

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe
      description: Served outside the validated /admin/ tree and needs no token.
      security: []
      responses:
        "200":
          description: The listener is up.

  /admin/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange an email and a password for a session
      description: No token needed. Unknown email, wrong password, disabled account and rate limiting share one 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session. Both tokens are plaintext here and nowhere else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate a refresh token into a new session
      description: |
        No access token needed. The presented token is revoked and replaced. Replaying a rotated one cuts
        the person's whole set and audits `user.refresh_reuse`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new access token and the refresh token that replaces the presented one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh token
      description: Needs an access token; the one change a `readonly` caller may make. An unknown token answers 204 too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The token is revoked, or was already.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/auth/me:
    get:
      operationId: whoami
      tags: [auth]
      summary: Who this token authenticates as
      description: Answers for either kind of caller. It reports the role, it does not grant it.
      responses:
        "200":
          description: The authenticated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a tenant
      description: |
        external_id is unique: the same body again returns the existing tenant with 200, not 201. A different
        name or metadata for a taken external_id is a 409. Metadata is compared by meaning, not by bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTenant"
      responses:
        "201":
          description: The tenant was created by this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "200":
          description: A tenant with this external_id, name and metadata already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    get:
      operationId: listTenants
      tags: [tenants]
      summary: List tenants
      parameters:
        - name: include_disabled
          in: query
          description: Include disabled tenants. Off by default.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum tenants returned. Absent or 0 means 100.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      responses:
        "200":
          description: Tenants, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Read one tenant
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Change a tenant's name and/or metadata
      description: Only the fields present change. external_id is not patchable; setting the same values is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantPatch"
      responses:
        "200":
          description: The tenant as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    delete:
      operationId: disableTenant
      tags: [tenants]
      summary: Disable a tenant
      description: Disables the tenant; tenants are never deleted. Its keys stop authenticating. Repeating is a no-op.
      responses:
        "200":
          description: The tenant, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}/enable:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
    post:
      operationId: enableTenant
      tags: [tenants]
      summary: Re-enable a disabled tenant
      description: Enabling an enabled tenant is a no-op that returns it unchanged.
      responses:
        "200":
          description: The tenant, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}/keys:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
    post:
      operationId: createAPIKey
      tags: [keys]
      summary: Mint an API key
      description: |
        Every call mints a new secret, so a retry mints a second key by design; list the tenant's keys and
        revoke the extra. The body is optional. A disabled tenant cannot be issued keys (409).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAPIKey"
      responses:
        "201":
          description: The key, with `secret` holding the plaintext. The only response it appears in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    get:
      operationId: listAPIKeys
      tags: [keys]
      summary: List a tenant's keys, revoked ones included
      responses:
        "200":
          description: The tenant's keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/KeyID"
    get:
      operationId: getAPIKey
      tags: [keys]
      summary: Read one key
      responses:
        "200":
          description: The key. Its secret is never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    patch:
      operationId: updateAPIKey
      tags: [keys]
      summary: Replace a key's model allowlist
      description: Changing a revoked key's allowlist is a 409. Setting the allowlist it already has is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyPatch"
      responses:
        "200":
          description: The key as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    delete:
      operationId: revokeAPIKey
      tags: [keys]
      summary: Revoke a key
      description: |
        Revokes the key; keys are never deleted, so they stay attributable in old ledger rows. The proxy
        answers 401 for it from then on. Revoking twice is a no-op.
      responses:
        "200":
          description: The key, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}/quotas:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
    get:
      operationId: listQuotas
      tags: [quotas]
      summary: The tenant's whole quota set
      responses:
        "200":
          description: Every quota, in window order (minute, hour, day, month, period).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    put:
      operationId: replaceQuotas
      tags: [quotas]
      summary: Replace the tenant's whole quota set
      description: |
        The body becomes the tenant's entire set, in one transaction: windows left out are removed.
        Sending the same set again writes no audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaSet"
      responses:
        "200":
          description: The set as it now is, in window order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}/quotas/{window}:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
      - $ref: "#/components/parameters/Window"
    get:
      operationId: getQuota
      tags: [quotas]
      summary: One window's quota
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    put:
      operationId: putQuota
      tags: [quotas]
      summary: Set one window's quota, leaving the others alone
      description: The window comes from the path. A body that names one must name the same window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaInput"
      responses:
        "200":
          description: The quota as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

    delete:
      operationId: deleteQuota
      tags: [quotas]
      summary: Remove one window's quota
      description: Answers 204 whether or not the quota existed. Quotas carry no history, so this really deletes.
      responses:
        "204":
          description: There is no quota for this window.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}/usage:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
    get:
      operationId: getUsage
      tags: [observability]
      summary: What did this tenant spend, and on what?
      description: |
        Requests, tokens, spend, outcomes and latency over a half-open period (`since` inclusive, `until`
        exclusive), as one total or grouped. Rows come most expensive first. Amounts are in nanodollars.
      parameters:
        - name: since
          in: query
          required: true
          description: Start of the period, inclusive. Required.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End of the period, exclusive. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          description: The dimension to put one row on each value of. `none` is the default.
          schema:
            $ref: "#/components/schemas/UsageGroupBy"
        - name: meta_key
          in: query
          description: Which metadata key to group by. Required when `group_by` is `metadata`, refused otherwise.
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          description: Maximum rows returned. Absent or 0 means 500.
          schema:
            type: integer
            minimum: 0
            maximum: 5000
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/tenants/{tenant}/audit:
    parameters:
      - $ref: "#/components/parameters/TenantRef"
    get:
      operationId: listAudit
      tags: [observability]
      summary: A tenant's audit events, newest first
      description: |
        Everything `audit_log` holds for this tenant -- routed requests and admin mutations -- in one
        cursor-paged list. The routing story itself is at `GET /admin/v1/requests/{decision_id}`.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End of the range, exclusive. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: |
            `next_cursor` from the previous page, passed back exactly as given and only with the same range.
            One that does not decode is a 400.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          description: Maximum events in the page. Absent or 0 means 50.
          schema:
            type: integer
            minimum: 0
            maximum: 500
      responses:
        "200":
          description: One page of events, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

  /admin/v1/requests/{decision_id}:
    parameters:
      - $ref: "#/components/parameters/DecisionID"
    get:
      operationId: getRequest
      tags: [observability]
      summary: Why did this request go where it did?
      description: |
        One decision in full: what was asked for, the ladder, every attempt, and what it cost. Not scoped
        to a tenant; the response says which tenant it belonged to.
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DecisionNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "504":
          $ref: "#/components/responses/Timeout"

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: |
        A machine credential, or a person's access token from /admin/v1/auth/login. Role and identity are
        read from the row on every request. `admin` may write; `readonly` may only read, and writes are 403.
  parameters:
    TenantRef:
      name: tenant
      in: path
      required: true
      description: |
        The tenant's go-route UUID or its external_id. A value that parses as a UUID is tried as go-route's
        id first, then as an external id.
      schema:
        type: string
        minLength: 1

    KeyID:
      name: key
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Window:
      name: window
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WindowKind"

    DecisionID:
      name: decision_id
      in: path
      required: true
      description: The decision id, `dec_` and a UUID as the response header carries it. The bare UUID is accepted too.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Malformed or fails validation (type invalid_request_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        No token, or one unknown, revoked, expired or disabled -- the answer does not distinguish them
        (type authentication_error).
      headers:
        WWW-Authenticate:
          description: Always `Bearer`, as RFC 9110 requires of a 401.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The credential is `readonly` and the request is not a GET or a HEAD (type permission_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such tenant, key or quota (type not_found_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DecisionNotFound:
      description: |
        No decision with this id is held (type not_found_error). It may have aged out with its partition
        rather than never existed, and the message says so.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The change contradicts the current state (type conflict_error): an external_id taken by a different
        tenant, a key for a disabled tenant, or a change to a revoked key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The body is over 1 MiB (type invalid_request_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Timeout:
      description: |
        The request outlived `admin.request_timeout` (type timeout_error). Its transaction was rolled
        back, so a retry is safe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Something failed inside, almost always the database (type internal_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      description: The proxy's error envelope, so one client-side decoder serves both APIs.
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [message, type]
      properties:
        message:
          type: string
          description: A sentence about what was wrong, for a human.
        type:
          type: string
          description: The class of error, for a program.
          enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - not_found_error
            - conflict_error
            - timeout_error
            - internal_error

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Compared lower-cased.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Never stored, never logged and never echoed.

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512

    Session:
      type: object
      required: [access_token, token_type, expires_at, refresh_token, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: When the access token stops verifying.
        refresh_token:
          type: string
          description: Opaque, stored as a SHA-256, and rotated by every refresh.
        user:
          $ref: "#/components/schemas/AdminUser"

    AdminUser:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Lower-cased, and the audit identity this person acts under, as `user:<email>`.
        role:
          $ref: "#/components/schemas/AdminRole"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: When this person was locked out, null for one who is not. People are disabled, never deleted.
        last_login_at:
          type: string
          format: date-time
          nullable: true

    AdminRole:
      type: string
      description: |
        `admin` may read and write; `readonly` may only read, and any other method is a 403.
      enum: [admin, readonly]

    Identity:
      type: object
      required: [actor, kind, role]
      properties:
        actor:
          type: string
          description: |
            The audit identity: `user:<email>` for a person, `admin:<name>` for a machine credential.
        kind:
          type: string
          enum: [user, machine]
        role:
          $ref: "#/components/schemas/AdminRole"
        user:
          $ref: "#/components/schemas/AdminUser"

    TenantMetadata:
      type: object
      additionalProperties: true
      description: |
        An opaque JSON object the customer attaches; go-route stores it and never reads it. Compared by
        meaning, not by bytes.
      x-go-type: json.RawMessage

    Tenant:
      type: object
      required: [id, external_id, name, metadata, created_at, disabled_at]
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
          description: The tenant's id in the customer's own system. It never changes.
        name:
          type: string
        metadata:
          $ref: "#/components/schemas/TenantMetadata"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: When the tenant was disabled; null while it is enabled.

    NewTenant:
      type: object
      additionalProperties: false
      required: [external_id, name]
      properties:
        external_id:
          type: string
          description: |
            Unique. At most 256 bytes of UTF-8, with no surrounding whitespace: rejected rather than trimmed.
        name:
          type: string
          description: Not blank, at most 256 characters.
        metadata:
          $ref: "#/components/schemas/TenantMetadata"

    TenantPatch:
      type: object
      additionalProperties: false
      description: Only the fields present change, and at least one must be. external_id is not patchable.
      properties:
        name:
          type: string
        metadata:
          $ref: "#/components/schemas/TenantMetadata"

    TenantList:
      type: object
      required: [tenants]
      properties:
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"

    ModelAllowlist:
      type: array
      nullable: true
      maxItems: 256
      items:
        type: string
      description: |
        The aliases the key may request: null allows every alias, [] allows none. Aliases are not checked
        against the loaded config. Blank and duplicate aliases are refused.
    APIKey:
      type: object
      description: A key as the admin API shows it. The secret is not here; only its SHA-256 is stored.
      required: [id, tenant_id, key_prefix, model_allowlist, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        key_prefix:
          type: string
          description: The visible head of the key (`gr_live_` and six more characters). Identification only.
        model_allowlist:
          $ref: "#/components/schemas/ModelAllowlist"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the key was revoked; null while it is live.

    IssuedAPIKey:
      description: The only place the plaintext ever appears. A caller that lost it revokes the key and mints another.
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The plaintext key, `gr_live_` plus 52 characters of base32. Returned once and never again.

    NewAPIKey:
      type: object
      additionalProperties: false
      properties:
        model_allowlist:
          $ref: "#/components/schemas/ModelAllowlist"

    APIKeyPatch:
      type: object
      additionalProperties: false
      description: |
        Required even though null is valid: absent is an error, null means every alias, [] means none.
      required: [model_allowlist]
      properties:
        model_allowlist:
          $ref: "#/components/schemas/ModelAllowlist"

    APIKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"

    WindowKind:
      type: string
      enum: [minute, hour, day, month, period]
      description: |
        `period` carries explicit period_start and period_end, for anniversary billing.
    QuotaAction:
      type: string
      enum: [block, allow]
      description: |
        `block` rejects the request with a 429; `allow` records the overage and keeps serving.
    Quota:
      type: object
      description: One spend cap. A quota limits money and nothing else.
      required: [window_kind, period_start, period_end, max_cost_nanos, on_exceed, updated_at]
      properties:
        window_kind:
          $ref: "#/components/schemas/WindowKind"
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        max_cost_nanos:
          type: integer
          format: int64
          description: What may be spent in the window, in nanodollars (1e-9 USD).
        on_exceed:
          $ref: "#/components/schemas/QuotaAction"
        updated_at:
          type: string
          format: date-time

    QuotaInput:
      type: object
      additionalProperties: false
      description: |
        on_exceed defaults to block. max_cost_nanos is required and may not be negative; 0 is a real cap
        that allows nothing.
      required: [max_cost_nanos]
      properties:
        window_kind:
          $ref: "#/components/schemas/WindowKind"
        period_start:
          type: string
          format: date-time
          nullable: true
          description: Required for window_kind period, rejected for anything else.
        period_end:
          type: string
          format: date-time
          nullable: true
          description: Required for window_kind period, after period_start.
        max_cost_nanos:
          type: integer
          format: int64
          minimum: 0
          description: What may be spent in the window, in nanodollars (1e-9 USD).
        on_exceed:
          $ref: "#/components/schemas/QuotaAction"

    QuotaSet:
      type: object
      additionalProperties: false
      description: |
        quotas is required: removing every limit has to be asked for explicitly, as {"quotas": []}.
      required: [quotas]
      properties:
        quotas:
          type: array
          description: The whole set. Every item needs window_kind, and each window may appear once.
          items:
            $ref: "#/components/schemas/QuotaInput"

    QuotaList:
      type: object
      required: [quotas]
      properties:
        quotas:
          type: array
          items:
            $ref: "#/components/schemas/Quota"

    TenantAuditDetail:
      type: object
      description: |
        What a tenant mutation writes to audit_log's detail, not an API response. Versioned here because
        rows written today are read months later.
      required: [external_id, name, metadata, disabled]
      properties:
        external_id:
          type: string
        name:
          type: string
        metadata:
          $ref: "#/components/schemas/TenantMetadata"
        disabled:
          type: boolean
          description: Whether the tenant was disabled after the change.

    APIKeyAuditDetail:
      type: object
      description: What a key mutation writes to audit_log's detail, never the secret. Not an API response.
      required: [key_prefix, model_allowlist, revoked]
      properties:
        key_prefix:
          type: string
          description: The visible head of the key, never the secret.
        model_allowlist:
          $ref: "#/components/schemas/ModelAllowlist"
        revoked:
          type: boolean
          description: Whether the key was revoked after the change.

    QuotaAuditDetail:
      type: object
      description: |
        One quota as a mutation writes it to audit_log's detail, the whole set as an array of these.
        Not an API response.
      required: [window_kind, max_cost_nanos, on_exceed]
      properties:
        window_kind:
          $ref: "#/components/schemas/WindowKind"
        period_start:
          type: string
          format: date-time
          description: Omitted rather than null when the window is not a period.
        period_end:
          type: string
          format: date-time
        max_cost_nanos:
          type: integer
          format: int64
        on_exceed:
          $ref: "#/components/schemas/QuotaAction"

    UsageGroupBy:
      type: string
      enum: [none, model, target, status, day, metadata]
      description: |
        One row per: the whole period (`none`), alias, serving target, outcome, UTC day, or `meta_key`
        value. `(unserved)` and `(unset)` are synthesised keys for unserved traffic and a missing value.
    TokenCounts:
      type: object
      description: Tokens, summed over everything the group covers.
      required: [input, output, cache_read, cache_write, reasoning]
      properties:
        input:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        cache_read:
          type: integer
          format: int64
        cache_write:
          type: integer
          format: int64
        reasoning:
          type: integer
          format: int64

    UsageComparison:
      type: object
      description: What this group's traffic would have cost on another target, the same tokens repriced. An estimate.
      required: [target, cost_nanos, requests]
      properties:
        target:
          type: string
        cost_nanos:
          type: integer
          format: int64
          description: What the group would have cost there, in nanodollars (1e-9 USD).
        requests:
          type: integer
          format: int64
          description: How many of the group's requests carried this comparison. Fewer than `requests` means it is partial.
    UsageTotals:
      type: object
      required:
        [requests, cost_nanos, unpriced, tokens, comparisons, ok, failed, truncated, disconnected]
      properties:
        requests:
          type: integer
          format: int64
        cost_nanos:
          type: integer
          format: int64
          description: Spend, in nanodollars (1e-9 USD). Divide by 1e9 for display only.
        unpriced:
          type: integer
          format: int64
          description: Requests the price table did not cover, and so excluded from `cost_nanos`.
        tokens:
          $ref: "#/components/schemas/TokenCounts"
        comparisons:
          type: array
          description: One entry per target this group's traffic was repriced against, in no particular order.
          items:
            $ref: "#/components/schemas/UsageComparison"
        ok:
          type: integer
          format: int64
          description: Requests that completed.
        failed:
          type: integer
          format: int64
          description: Requests where every target in the ladder failed before anything was sent.
        truncated:
          type: integer
          format: int64
          description: Requests that died after the response had started.
        disconnected:
          type: integer
          format: int64
          description: Requests the client hung up on.

    UsageRow:
      description: |
        `UsageTotals` plus the value the row groups on and latency. Latency is absent from the report's
        `total`, since percentiles cannot be combined across groups; ask ungrouped for it.
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [key, p50_ttft_ms, p95_ttft_ms, p95_total_ms]
          properties:
            key:
              type: string
              description: The value this row groups on, empty when ungrouped. See `UsageGroupBy` for the synthesised keys.
            p50_ttft_ms:
              type: integer
              description: Median time to first token, in milliseconds. Over requests that produced one.
            p95_ttft_ms:
              type: integer
              description: 95th percentile time to first token, in milliseconds.
            p95_total_ms:
              type: integer
              description: 95th percentile total duration, in milliseconds.

    UsageSpec:
      type: object
      description: What the report was asked for, as the server resolved it.
      required: [tenant, since, until, group_by]
      properties:
        tenant:
          type: string
          description: The tenant's external_id, whichever form the path used.
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          description: End of the period, exclusive; the server's clock when the caller left it out.
        group_by:
          $ref: "#/components/schemas/UsageGroupBy"
        meta_key:
          type: string
          description: The metadata key grouped on, present only when group_by is metadata.

    UsageReport:
      type: object
      required: [spec, rows, total, truncated_groups]
      properties:
        spec:
          $ref: "#/components/schemas/UsageSpec"
        rows:
          type: array
          description: The groups, most expensive first. A single row with an empty `key` when the report is ungrouped.
          items:
            $ref: "#/components/schemas/UsageRow"
        total:
          $ref: "#/components/schemas/UsageTotals"
        truncated_groups:
          type: integer
          format: int64
          description: How many groups fell beyond `limit` and are in neither `rows` nor `total`. Zero means complete.
    AuditEvent:
      type: object
      description: |
        One row of the audit log: routed traffic written by the gateway, or an admin mutation written
        inside the transaction it describes.
      required: [id, at, actor, action]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Null for an admin action taken before any tenant existed.
        key_id:
          type: string
          format: uuid
          nullable: true
          description: The API key involved, when one was.
        actor:
          type: string
          description: |
            `gateway` for routed traffic, `admin:<name>` or `user:<email>` for a mutation over this API,
            `cli:<os user>` for one from the CLI.
        action:
          type: string
          description: |
            `route_request` for routed traffic; otherwise the mutation, such as `tenant.create` or `key.revoke`.
        request_id:
          type: string
          nullable: true
          description: The decision id for routed traffic, to hand `GET /admin/v1/requests/{id}`. Null for a mutation.
        detail:
          type: string
          nullable: true
          description: |
            JSON in one of the `*AuditDetail` shapes for a mutation; the alias or rule that produced the
            ladder for routed traffic. A string because the column holds both.
        final_target:
          type: string
          nullable: true
          description: The target that served, null when none did.
        status_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: The message from the final attempt when it failed.

    AuditPage:
      type: object
      required: [events, next_cursor]
      properties:
        events:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type: string
          nullable: true
          description: |
            Where the next page starts, null on the last. Opaque: pass it back as `cursor` with the same range.
    DecisionStatus:
      type: string
      enum: [ok, exhausted, truncated, client_disconnect, policy_blocked]
      description: |
        `exhausted` means every target failed before anything was sent; `truncated` means it died after
        the response had started, and so billed tokens.
    DecisionTarget:
      type: object
      required: [name]
      properties:
        name:
          type: string
        provider:
          type: string
        upstream_model:
          type: string
        region:
          type: string

    DecisionAttemptFailure:
      type: object
      required: [kind, message, retryable]
      properties:
        kind:
          type: string
          description: What went wrong, such as `connect` or `status`.
        status_code:
          type: integer
          description: The upstream status, when the failure had one.
        message:
          type: string
        retryable:
          type: boolean
          description: Whether the ladder was allowed to move on to the next target.

    DecisionAttempt:
      type: object
      description: |
        One target actually tried, in order. The attempt without a `failure` served; every attempt has one
        when nothing did.
      required: [target, started_at, duration_ms]
      properties:
        target:
          type: string
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        failure:
          $ref: "#/components/schemas/DecisionAttemptFailure"

    DecisionLadder:
      type: object
      description: Which targets were eligible, in the order they would be tried, and why that set.
      required: [targets]
      properties:
        reason_kind:
          type: string
          description: |
            `model_alias` when the ladder came from the requested alias, `rule_match` when a rule produced it.
        model_alias:
          type: string
          description: The alias, when reason_kind is model_alias.
        rule_name:
          type: string
          description: The rule, when reason_kind is rule_match.
        policy_version:
          type: integer
        targets:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTarget"

    DecisionCounterfactual:
      type: object
      description: What this one request would have cost on another target.
      required: [target, cost_nanos]
      properties:
        target:
          type: string
        cost_nanos:
          type: integer
          format: int64
          description: In nanodollars (1e-9 USD).

    DecisionCost:
      type: object
      description: What the request cost. Absent when it was never priced, which is not the same as a cost of zero.
      required: [actual_nanos]
      properties:
        actual_nanos:
          type: integer
          format: int64
          description: What it cost, in nanodollars (1e-9 USD). Divide by 1e9 for display only.
        price_table_version:
          type: string
          description: The price table the cost was computed against, pinned so repricing does not rewrite history.
        counterfactuals:
          type: array
          items:
            $ref: "#/components/schemas/DecisionCounterfactual"

    DecisionTiming:
      type: object
      required: [ttft_ms, total_ms]
      properties:
        ttft_ms:
          type: integer
          description: Time to first token. Zero when no token ever arrived.
        total_ms:
          type: integer

    DecisionRequest:
      type: object
      description: The non-sensitive shape of what the client asked for. Never the body.
      required: [requested_model, stream, wants_usage, metadata]
      properties:
        requested_model:
          type: string
          description: The `model` field as the client sent it, which is an alias here.
        stream:
          type: boolean
        wants_usage:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
          description: What the client attached with `x-go-route-*` headers, and what `group_by=metadata` reports on.

    Decision:
      type: object
      description: |
        One request's whole story, from `usage_ledger` for cost and `audit_log` for routing. On a decision
        whose audit row has aged out, `ladder` may be empty and `attempts` absent.
      required: [id, occurred_at, tenant, request, ladder, status, attempts, tokens, timing]
      properties:
        id:
          type: string
          description: The decision id, in its `dec_` form.
        occurred_at:
          type: string
          format: date-time
        tenant:
          type: string
          description: The tenant's external_id.
        key_id:
          type: string
          format: uuid
          nullable: true
          description: The API key that authorised the request, null when none did.
        request:
          $ref: "#/components/schemas/DecisionRequest"
        ladder:
          $ref: "#/components/schemas/DecisionLadder"
        status:
          $ref: "#/components/schemas/DecisionStatus"
        chosen_target:
          type: string
          description: The target that served, absent when none did.
        attempts:
          type: array
          description: Every target tried, in order, successful or not.
          items:
            $ref: "#/components/schemas/DecisionAttempt"
        tokens:
          $ref: "#/components/schemas/TokenCounts"
        timing:
          $ref: "#/components/schemas/DecisionTiming"
        cost:
          $ref: "#/components/schemas/DecisionCost"
