version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - depguard
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck

  settings:
    depguard:
      rules:
        core-is-pure:
          files: ["**/internal/core/**"]
          deny:
            - pkg: "github.com/harrison542002/go-route/internal/adapters"
              desc: "core must not know about adapters"
            - pkg: "database/sql"
              desc: "core must not do I/O"
            - pkg: "net/http"
              desc: "core must not know about transport"

        adapters-are-leaves:
          files: ["**/internal/adapters/**"]
          deny:
            - pkg: "github.com/harrison542002/go-route/internal/usecases"
              desc: "adapters are driven by use cases, not the reverse"

        bootstrap-is-the-only-composition-root:
          files:
            - "**/internal/adapters/**"
            - "**/internal/usecases/**"
          deny:
            - pkg: "github.com/harrison542002/go-route/internal/bootstrap"
              desc: "nothing may import the composition root"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - depguard